[package]
name = "framenab"
description = "Cross-platform screenshots and GIF recordings with annotations"
default-run = "framenab"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary (Cargo issue #8519, mainly on Windows).
name = "framenab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
framenab-capture = { version = "0.4.0", path = "../crates/framenab-capture" }
framenab-core = { version = "0.4.0", path = "../crates/framenab-core" }
framenab-export = { version = "0.4.0", path = "../crates/framenab-export" }
framenab-render = { version = "0.4.0", path = "../crates/framenab-render" }
image = "0.25.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sys-locale = "0.3.2"
tauri = { version = "2.11.6", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-store = "2.4.5"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }
