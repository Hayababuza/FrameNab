[package]
name = "framenab-export"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
framenab-core = { version = "0.4.0", path = "../framenab-core" }
framenab-render = { version = "0.4.0", path = "../framenab-render" }
gifski = { version = "1.34.0", default-features = false }
image = "0.25.9"
image-webp = "0.2.4"
imgref = "1.12.3"
png = "0.18.1"
rgb = "0.8.53"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
which = "8.0.6"
zip = { version = "2", default-features = false }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3.27.0"
