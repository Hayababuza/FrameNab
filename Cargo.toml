[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.5.4"
edition = "2024"
license = "MIT"
authors = ["Daniel Trillo"]
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Keep image processing fast in debug builds too
[profile.dev.package."*"]
opt-level = 2
