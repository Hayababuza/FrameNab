name: Release

# Pushing a version tag (`git tag v0.4.0 && git push --tags`) builds the installers for every
# platform and attaches them to a draft release on GitHub. Check the draft, then publish it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: .deb, .rpm and .AppImage
          - platform: ubuntu-24.04
            args: ""
          # Windows: .msi and NSIS setup .exe
          - platform: windows-latest
            args: ""
          # macOS: one .dmg for Apple Silicon and Intel
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev libpipewire-0.3-dev libclang-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libgbm-dev libegl-dev rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: FrameNab ${{ github.ref_name }}
          releaseBody: |
            What is new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            **Downloads**
            - Windows: `FrameNab_*_x64-setup.exe` (or the `.msi`)
            - macOS (Apple Silicon and Intel): `FrameNab_*_universal.dmg` — the app is not notarized yet: right-click → Open the first time
            - Linux: `.deb` (Debian/Ubuntu), `.rpm` (Fedora/openSUSE) or `.AppImage` (any distribution)

            MP4/WebM export and lossy WebP need an installed FFmpeg.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
